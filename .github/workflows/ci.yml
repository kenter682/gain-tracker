name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx --workspace=frontend tsc --noEmit

      - name: Typecheck backend
        run: npx --workspace=backend tsc --noEmit

      - name: Build frontend
        run: npm run build
